services:
  app:
    build: .
    container_name: warung-app
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - .:/var/www/html
    environment:
      APP_URL: http://localhost:8085
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: warung
      DB_USERNAME: warung
      DB_PASSWORD: rahasia
    networks:
      - default
      - mysqlnet

networks:
  mysqlnet:
    external: true
    name: sekolah-dev_default